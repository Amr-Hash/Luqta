<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Luqta</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        width: 300px;
        padding: 14px;
        color: #161a14;
        background: #e7e3d6;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        color: #1a2c1c;
      }
      .sub {
        margin: 4px 0 12px;
        font-size: 12px;
        color: #5c6356;
        line-height: 1.35;
      }
      .card {
        border: 1px solid #cdc6b4;
        border-radius: 12px;
        background: #f3f0e6;
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      .label {
        font-size: 11px;
        font-weight: 600;
        color: #5c6356;
        margin-bottom: 4px;
      }
      .title {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
        word-break: break-word;
      }
      .url {
        margin-top: 6px;
        font-size: 11px;
        color: #5c6356;
        word-break: break-all;
      }
      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        background: #2f4a32;
        color: #f3f0e6;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #1a2c1c;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .status {
        margin-top: 8px;
        font-size: 12px;
        color: #5c6356;
        min-height: 1.2em;
      }
      .status.err {
        color: #9c3a2e;
      }
      a.opts {
        display: inline-block;
        margin-top: 10px;
        font-size: 12px;
        color: #2f4a32;
      }
    </style>
  </head>
  <body>
    <h1>لقطة</h1>
    <p class="sub">Add this page to your wishlist</p>
    <div class="card">
      <div class="label">Current page</div>
      <div id="title" class="title">…</div>
      <div id="url" class="url"></div>
    </div>
    <button id="add" type="button">＋ Add to Luqta</button>
    <p id="status" class="status" role="status"></p>
    <a class="opts" href="options.html" target="_blank" rel="noreferrer">Options</a>
    <script src="popup.js" type="module"></script>
  </body>
</html>
