<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Luqta extension options</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        min-width: 320px;
        color: #161a14;
        background: #e7e3d6;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cdc6b4;
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        background: #f3f0e6;
      }
      button {
        margin-top: 12px;
        min-height: 40px;
        border: 0;
        border-radius: 10px;
        padding: 0 14px;
        background: #2f4a32;
        color: #f3f0e6;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      p {
        margin: 8px 0 0;
        font-size: 12px;
        color: #5c6356;
        line-height: 1.4;
      }
      .ok {
        color: #2f4a32;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <label for="base">Luqta app URL</label>
    <input
      id="base"
      type="url"
      placeholder="https://amr-hash.github.io/Luqta"
      autocomplete="off"
    />
    <button id="save" type="button">Save</button>
    <p>
      Opens <code>/share?url=…&title=…</code> on this base. Use local
      <code>http://localhost:5173</code> while developing.
    </p>
    <p id="status" hidden class="ok">Saved.</p>
    <script src="options.js" type="module"></script>
  </body>
</html>
